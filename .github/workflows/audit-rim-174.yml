name: Audit RIM iteration 174 archive

on:
  push:
    branches:
      - import/iteration-174
    paths:
      - .github/workflows/audit-rim-174.yml
      - RIM_4.1.8_ITERATION_174_DESIGN_FIXED.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/iteration-174
      - name: Inspect ZIP structure and E2E SDK assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import json

          archive = Path("RIM_4.1.8_ITERATION_174_DESIGN_FIXED.zip")
          if not archive.is_file():
              raise SystemExit(f"Archive missing: {archive}")
          with ZipFile(archive) as zf:
              entries = zf.infolist()
              if not entries or len(entries) > 30000:
                  raise SystemExit("Empty archive or too many entries")
              total = 0
              names = []
              for item in entries:
                  name = item.filename.replace("\\\\", "/")
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts or ".git" in p.parts:
                      raise SystemExit(f"Unsafe path: {item.filename}")
                  if ((item.external_attr >> 16) & 0o170000) == 0o120000:
                      raise SystemExit(f"Symlink rejected: {item.filename}")
                  total += item.file_size
                  if total > 500 * 1024 * 1024:
                      raise SystemExit("Expanded archive exceeds 500 MiB")
                  names.append(name)
              print(f"ZIP entries: {len(entries)}; expanded bytes: {total}")
              print("\\nTOP-LEVEL ENTRIES:")
              for x in sorted({n.split('/')[0] for n in names if n.strip('/')}):
                  print("  " + x)
              print("\\nPROJECT ROOT CANDIDATES:")
              candidates = []
              for n in names:
                  if n.endswith("/package.json") or n == "package.json":
                      prefix = n[:-len("package.json")]
                      if (prefix + "index.html") in names:
                          candidates.append(prefix or ".")
              print("\\n".join("  " + x for x in sorted(set(candidates))) or "  NONE")
              print("\\nE2E / SDK / CRYPTO CANDIDATE FILES:")
              matches = [n for n in names if any(k in n.lower() for k in
                         ("sdk", "signal", "libsignal", "e2e", "crypto", "encrypt", "decrypt", "olm", "sodium"))]
              for n in matches[:500]:
                  print("  " + n)
              if len(matches) > 500:
                  print(f"  ... {len(matches)-500} more")
              print("\\nTEST FILES CONTAINING LEGACY BASELINE TEXT:")
              for n in names:
                  if n.startswith("RIM_4.1.8_ITERATION_174/tests/") and n.endswith(".js"):
                      raw = zf.read(n).decode("utf-8", errors="replace")
                      for line in raw.splitlines():
                          if "4.0.0" in line or "4\\\\.0" in line:
                              print(f"  {n}: {line!r}")
              print("\\nMANIFESTS:")
              for n in names:
                  if n.endswith("package.json") and ("node_modules" not in n):
                      try:
                          data = json.loads(zf.read(n))
                          deps = {**data.get("dependencies", {}), **data.get("devDependencies", {})}
                          relevant = {k:v for k,v in deps.items() if any(t in k.lower() for t in ("signal","e2e","crypto","sodium","olm"))}
                          if relevant:
                              print(f"  {n}: {relevant}")
                      except Exception as e:
                          print(f"  Could not parse {n}: {e}")
              print("\\nKEY FILE CONTENTS:")
              wanted = ("package.json", "rim-e2e-sdk-bootstrap.yml", "rim-e2e-sdk-download.yml",
                        "e2e-signal-sdk-installation.test.js", "SDK_OFFLINE_BOOTSTRAP_NEXT_AI.md",
                        "E2E_DEPENDENCY_BOOTSTRAP.md")
              for n in names:
                  if any(n.endswith(w) for w in wanted):
                      print(f"\\n--- {n} ---")
                      try:
                          print(zf.read(n).decode("utf-8")[:24000])
                      except Exception as e:
                          print(f"Cannot read text: {e}")
          PY
