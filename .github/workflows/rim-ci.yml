name: RIM verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Refresh lockfile for pinned browser client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Cloudflare public assets
        run: npm run build:cloudflare
      - name: Verify Signal SDK entrypoint and browser stores
        shell: bash
        run: |
          node --input-type=module -e "import('@open-e2ee/signal-protocol-sdk').then(m => { if (typeof m.createSignalProtocolClient !== 'function') process.exit(2); console.log('Signal SDK entrypoint OK'); })"
          test -f node_modules/@open-e2ee/signal-protocol-sdk/dist/local/store/web-sqlite/index.js
          test -f node_modules/@open-e2ee/signal-protocol-sdk/dist/local/store/web/index.js
      - name: Verify architecture, syntax, and unit tests
        run: npm run verify
      - name: Verify Signal relay adapter round trips
        run: npm run test:e2e:relay
      - name: Confirm private server code is not in public output
        run: test ! -e dist/supabase && test ! -e dist/tests && test ! -e dist/docs
