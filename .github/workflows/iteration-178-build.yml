name: RIM Iteration 178 build
on:
  push:
    branches: [feat/iteration-176-zladen-feed, main]
    paths:
      - 'src/application/auth-form-controller.js'
      - 'src/application/telegram-auth-service.js'
      - 'assets/js/rim-runtime-bootstrap.js'
      - 'assets/js/rim-build-diagnostics.js'
      - 'assets/js/rim-auth-zladen-bridge.js'
      - 'tests/auth-form-controller-session-sync.test.js'
      - 'tests/iteration-175-auth-feed-zladen.test.js'
      - 'tests/regression-engineering-97.test.js'
      - 'tests/supabase-local-bundle.test.js'
      - '.github/workflows/iteration-178-build.yml'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-cloudflare.mjs'
      - 'scripts/supabase-browser-entry.js'
      - 'src/composition/shell-surface.js'
      - 'src/app.js'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Refresh lockfile for pinned browser client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run build:cloudflare
      - name: Verify Signal SDK and browser stores
        run: |
          node --input-type=module -e "import('@open-e2ee/signal-protocol-sdk').then(m => { if (typeof m.createSignalProtocolClient !== 'function') process.exit(2); console.log('Signal SDK entrypoint OK'); })"
          test -f node_modules/@open-e2ee/signal-protocol-sdk/dist/local/store/web-sqlite/index.js
          test -f node_modules/@open-e2ee/signal-protocol-sdk/dist/local/store/web/index.js
      - run: npm run check
      - run: npm run check:syntax
      - run: npm test
      - run: npm run test:e2e:relay
      - name: Publish generated browser assets to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json assets/js/rim-app.bundle.js assets/js/supabase-client.bundle.js assets/js/e2e/sqlite-worker.js assets/js/e2e/sqlite3.wasm index.html
          if git diff --cached --quiet; then
            echo "Generated browser assets are already current."
          else
            git commit -m "Build RIM browser assets"
            git push origin HEAD:main
          fi
      - name: Package complete project
        run: |
          zip -qr RIM_4.1.8_ITERATION_178_ZLADEN_FEED.zip . -x './.git/*' './.env' './.env.*' './**/.env' './**/.env.*'
          sha256sum RIM_4.1.8_ITERATION_178_ZLADEN_FEED.zip > RIM_4.1.8_ITERATION_178_ZLADEN_FEED.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RIM_4.1.8_ITERATION_178_ZLADEN_FEED
          path: |
            RIM_4.1.8_ITERATION_178_ZLADEN_FEED.zip
            RIM_4.1.8_ITERATION_178_ZLADEN_FEED.zip.sha256
          if-no-files-found: error
          retention-days: 14
