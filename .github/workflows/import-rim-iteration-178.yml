name: RIM Iteration 178 ZIP import

on:
  push:
    branches:
      - import/rim-iteration-178
    paths:
      - '.github/workflows/import-rim-iteration-178.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rim-iteration-178-import
  cancel-in-progress: false

jobs:
  validate-extract-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: import/rim-iteration-178
          fetch-depth: 0

      - name: Validate and extract the exact Iteration 178 archive
        shell: bash
        run: |
          set -euo pipefail
          archive="RIM_4.1.8_ITERATION_178_AUTHFIX3_OPTIMIZED.zip"
          expected="ab3e544609ee37f9a28de3973a322b93501b771691bd6023407303c32b711ae0"
          test -s "$archive"
          echo "$expected  $archive" | sha256sum --check -
          unzip -t "$archive"
          if unzip -Z1 "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe ZIP path detected"; exit 1
          fi
          mkdir -p /tmp/rim-zip
          unzip -q "$archive" -d /tmp/rim-zip
          mapfile -t manifests < <(find /tmp/rim-zip -maxdepth 3 -type f -name package.json -not -path '*/node_modules/*')
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "Expected exactly one project package.json within archive root"; printf '%s\n' "${manifests[@]}"; exit 1
          fi
          project_root="$(dirname "${manifests[0]}")"
          for item in index.html wrangler.jsonc scripts src assets icons supabase; do
            test -e "$project_root/$item" || { echo "Missing required project item: $item"; exit 1; }
          done
          test -s "$project_root/package-lock.json"
          echo "RIM_PROJECT_ROOT=$project_root" >> "$GITHUB_ENV"

      - name: Replace repository root with archive project (no source edits)
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' "$RIM_PROJECT_ROOT/" ./
          rm -f RIM_4.1.8_ITERATION_178_AUTHFIX3_OPTIMIZED.zip
          rm -f RIM_4.1.8_ITERATION_178_AUTHFIX3_OPTIMIZED.zip.sha256
          test -f package.json
          test -f index.html
          test -f wrangler.jsonc
          test -d src
          test -d assets
          test -d supabase
          if [ -d node_modules ]; then echo "Unexpected node_modules in imported source"; exit 1; fi

      - name: Install exact locked dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci

      - name: Verify Signal SDK and browser stores
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import('@open-e2ee/signal-protocol-sdk').then(m => { if (typeof m.createSignalProtocolClient !== 'function') process.exit(2); console.log('Signal SDK entrypoint OK'); })"
          test -f node_modules/@open-e2ee/signal-protocol-sdk/dist/local/store/web-sqlite/index.js
          test -f node_modules/@open-e2ee/signal-protocol-sdk/dist/local/store/web/index.js
          echo "Signal SDK 14.7.0 browser stores OK"

      - name: Project checks
        run: |
          npm run check
          npm run check:syntax
          npm test
          npm run test:e2e:relay
          npm run build:cloudflare

      - name: Commit extracted project at repository root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import RIM 4.1.8 Iteration 178 at repository root"
          git push origin HEAD:import/rim-iteration-178
