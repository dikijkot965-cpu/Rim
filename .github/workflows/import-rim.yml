name: Import RIM archive

on:
  push:
    branches:
      - import/iteration-125
    paths:
      - '*.zip'

permissions:
  contents: write

concurrency:
  group: rim-archive-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and extract archive
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t archives < <(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n')
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP archive in repository root; found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          test -s "$archive"

          if unzip -Z1 "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path detected"
            exit 1
          fi

          mkdir -p /tmp/rim-import
          unzip -q "$archive" -d /tmp/rim-import

          test -f /tmp/rim-import/package.json
          test -f /tmp/rim-import/index.html
          test -f /tmp/rim-import/wrangler.jsonc
          test -d /tmp/rim-import/scripts
          test -d /tmp/rim-import/src
          test -d /tmp/rim-import/assets
          test -d /tmp/rim-import/icons
          test -d /tmp/rim-import/supabase

          echo "RIM_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Replace repository contents with archive
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='*.zip' \
            /tmp/rim-import/ ./
          rm -f "$RIM_ARCHIVE"

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Archive produced no repository changes"
            exit 0
          fi

          git commit -m "Import RIM iteration 125"
          git push origin HEAD:import/iteration-125
